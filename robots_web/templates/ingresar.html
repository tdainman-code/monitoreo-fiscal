{% extends "base.html" %}{% block titulo %}Ingresar{% endblock %}
{% block cuerpo %}
<form class="tarjeta login" method="post">
  <h1>Monitoreo fiscal</h1>
  <p class="sutil">Estudio Mancovsky — uso interno</p>
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Usuario<input name="usuario" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
  <button>Ingresar</button>
</form>
{% endblock %}
