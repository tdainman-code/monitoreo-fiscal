<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
<title>{% block titulo %}Estudio Mancovsky{% endblock %} · Monitoreo fiscal</title>
</head>
<body>
{% if session.usuario %}
<header class="barra">
  <a class="marca" href="{{ url_for('inicio') }}">Monitoreo fiscal</a>
  <nav>
    <a href="{{ url_for('inicio') }}">Clientes</a>
    <a href="{{ url_for('alertas') }}">Alertas del día</a>
    <a href="{{ url_for('cartera', vista='dfe') }}">Cartera</a>
    <a href="{{ url_for('mas') }}">⚙ Más</a>
  </nav>
  <div class="yo"><a href="{{ url_for('mi_clave') }}" title="Cambiar contraseña">{{ session.nombre }}</a> · <a href="{{ url_for('salir') }}">Salir</a></div>
</header>
{% endif %}
<main>
{% with m = get_flashed_messages(with_categories=true) %}{% for cat, t in m %}<div class="aviso {{ cat }}">{{ t }}</div>{% endfor %}{% endwith %}
{% block cuerpo %}{% endblock %}
</main>
</body>
</html>
