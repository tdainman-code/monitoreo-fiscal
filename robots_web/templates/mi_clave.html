{% extends "base.html" %}{% block titulo %}Mi contraseña{% endblock %}
{% block cuerpo %}
<form class="tarjeta login" method="post">
  <h1>Cambiar mi contraseña</h1>
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Contraseña actual<input name="actual" type="password" autocomplete="current-password" required></label>
  <label>Nueva (mínimo 10 caracteres)<input name="nueva" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Repetir nueva<input name="repetir" type="password" autocomplete="new-password" minlength="10" required></label>
  <button>Guardar</button>
</form>
{% endblock %}
